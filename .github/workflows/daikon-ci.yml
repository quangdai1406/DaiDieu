name: daikon-ci
on:
  push:
    paths: ["daikon/**", ".github/workflows/daikon-ci.yml"]
  pull_request:
    paths: ["daikon/**", ".github/workflows/daikon-ci.yml"]
permissions:
  contents: read
jobs:
  windows-full:
    runs-on: windows-latest
    defaults: {run: {working-directory: daikon}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]" pip-audit
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: pip-audit
  linux-unit:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: daikon}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -m "unit or security"
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
